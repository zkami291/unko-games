<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ウンコシューティング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
/* VOICE: くだらなさ全開、でも手触りは本物の縦シュー
   IDEA: 夜の公衆トイレのタイル床を縦スクロールする筐体ゲーム
   PICTURE: 9:16のゲーム画面そのもの。💩自機、🧻ザコ、🚽ボス、水しぶき弾
   COLOUR and TYPE: 深いタイル色の地、白い目地、ウンコ茶とトイレ青のアクセント。Dela Gothic One + M PLUS Rounded
   LAYOUT: 上にHUD一列、その下に画面いっぱいのゲーム、右下にボムボタン */
:root{color-scheme:dark;--bg:#0b2229;--ink:#e8f5f8;--accent:#4fb3e8;--brown:#a8692f;--panel:#14363f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "M PLUS Rounded 1c",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{height:100dvh;display:flex;flex-direction:column;align-items:center;padding:6px 6px 8px;gap:6px}
.hud{width:100%;max-width:480px;display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;font-weight:800;font-size:14px}
.hud .r{text-align:right}
.hud b{font:400 20px/1 "Dela Gothic One",sans-serif;font-variant-numeric:tabular-nums}
.hud small{display:block;font-size:13px;opacity:.75;font-weight:500;white-space:nowrap}
.wp{background:var(--panel);border-radius:10px;padding:3px 10px;text-align:center;white-space:nowrap;font-size:13px}
.stage{flex:1;width:100%;display:grid;place-items:center;min-height:0}
.wrap{position:relative;aspect-ratio:9/16;height:100%;max-width:100%;max-height:100%;border-radius:14px;overflow:hidden;box-shadow:0 0 0 3px #1d4d59,0 12px 40px #0008;touch-action:none}
@supports not (aspect-ratio:1){.wrap{width:100%}}
canvas{display:block;width:100%;height:100%}
#bomb{position:absolute;right:10px;bottom:10px;width:64px;height:64px;border-radius:50%;border:3px solid #fff8;background:#ffffff22;font-size:30px;color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(2px)}
#bomb span{position:absolute;right:-2px;top:-4px;background:var(--brown);border-radius:10px;font:800 13px/1 "M PLUS Rounded 1c";padding:4px 6px}
#bomb:focus-visible,button:focus-visible{outline:3px solid #f2b53a;outline-offset:2px}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;background:linear-gradient(#0b2229e6,#0b2229f2)}
.ov.show{display:flex}
.ov h1{font:400 clamp(30px,9vw,46px)/1.05 "Dela Gothic One",sans-serif;margin:0;text-wrap:balance}
.ov h1 em{font-style:normal;color:var(--accent)}
.ov h2{font:400 32px/1.1 "Dela Gothic One",sans-serif;margin:0}
.big{font-size:64px;line-height:1}
.items{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;text-align:left;font-size:14px;background:#ffffff10;border-radius:12px;padding:10px 14px;max-width:300px}
.items i{font-style:normal;font-size:20px;line-height:1.2}
.ov p{margin:0;font-size:14px;opacity:.85}
.go{font:800 18px "M PLUS Rounded 1c",sans-serif;min-height:52px;padding:0 32px;border-radius:14px;border:0;background:var(--accent);color:#06222c;cursor:pointer}
@media(prefers-reduced-motion:reduce){.go{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div><small>スコア</small><b id="sc">0</b></div>
    <div class="wp" id="wp">🌶️ 拡散 Lv1</div>
    <div class="r"><small>残機 <span id="lv">💩💩💩</span></small><small>ST <span id="st">1</span> / HI <span id="hi">0</span></small></div>
  </div>
  <div class="stage"><div class="wrap" id="wrap">
    <canvas id="cv" aria-label="ゲーム画面"></canvas>
    <button id="bomb" aria-label="ボム">💨<span id="bn">2</span></button>
    <div class="ov show" id="title">
      <div class="big">💩</div>
      <h1>ウンコ<br><em>シューティング</em></h1>
      <p>迫りくるトイレットペーパーをかわし、便器を倒せ。</p>
      <div class="items">
        <i>🌶️</i><span>拡散ウンコ弾（取るほど広がる）</span>
        <i>🍠</i><span>おいもホーミング（追いかける）</span>
        <i>🥛</i><span>牛乳ラピッド（貫通の連射）</span>
        <i>💨</i><span>ボム＋1（画面の弾を消す）</span>
        <i>💖</i><span>残機＋1</span>
      </div>
      <p>指でドラッグして移動、弾は自動で発射。<br>PCは矢印キーで移動、Xキーでボム。</p>
      <button class="go" id="start">スタート</button>
    </div>
    <div class="ov" id="over">
      <div class="big">🚽</div>
      <h2>流された…</h2>
      <p id="res"></p>
      <button class="go" id="retry">もう一回</button>
    </div>
    <div class="ov" id="pause"><h2>一時停止</h2><button class="go" id="resume">つづける</button></div>
  </div></div>
</div>
<script>
{
const W=360,H=640,cv=document.getElementById('cv'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap'),$=i=>document.getElementById(i),R=Math.random;
const EF='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const WN={S:'拡散',H:'ホーミング',R:'ラピッド'},WE={S:'🌶️',H:'🍠',R:'🥛'};
let mode='title',paused=false,st,score,hi=0,P,pb,eb,en,it,fx,q,t,spcd,boss,clearT,flash,shake,bgy=0,id=0,hudT=0;
pb=[];eb=[];en=[];it=[];fx=[];q=[];flash=0;shake=0;
try{hi=+localStorage.getItem('unko-shmup-hi')||0}catch(_){}
const SC={};
function sp(e,s){const k=e+s;if(SC[k])return SC[k];const z=Math.ceil(s*1.4*2.5),c=document.createElement('canvas');c.width=c.height=z;const x=c.getContext('2d');x.font=`${s*2.5}px ${EF}`;x.textAlign='center';x.textBaseline='middle';x.fillText(e,z/2,z/2+s*.2);return SC[k]=c}
function de(e,x,y,s,a){const c=sp(e,s),z=s*1.4;if(a){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.drawImage(c,-z/2,-z/2,z,z);ctx.restore()}else ctx.drawImage(c,x-z/2,y-z/2,z,z)}
function fit(){const d=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=Math.round(w*d);cv.height=Math.round(h*d);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0)}
const ro=new ResizeObserver(fit);ro.observe(cv);

function newGame(){st=1;score=0;P={x:W/2,y:H-90,lives:3,bombs:2,w:'S',lv:1,cd:0,inv:120};reset();mode='play';$('title').classList.remove('show');$('over').classList.remove('show');hud()}
function reset(){pb=[];eb=[];en=[];it=[];fx=[];q=[];t=0;spcd=60;boss=null;clearT=0;flash=0;shake=0}
const ang=(x,y)=>Math.atan2(P.y-y,P.x-x),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function shot(x,y,a,s,r=5){eb.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r})}
function ring(x,y,n,s,o=0){for(let i=0;i<n;i++)shot(x,y,o+i*Math.PI*2/n,s)}
const sp0=()=>2.1+st*.25;
function mk(type,x,y,o={}){const B={a:[1,13,22,100],b:[2,13,22,150],c:[5,15,26,300],d:[16,26,44,1200]}[type];en.push(Object.assign({id:++id,type,x,y,x0:x,hp:B[0]+(st-1)*(type==='d'?6:1),r:B[1],sz:B[2],pts:B[3],age:0,fl:0},o))}
function addQ(d,f){q.push({at:t+d,f})}
function pattern(){const r=R();
 if(r<.35){const x=40+R()*280,dir=R()<.5?-1:1;for(let i=0;i<5;i++)addQ(i*14,()=>mk('a',Math.min(330,Math.max(30,x+dir*i*12)),-20))}
 else if(r<.65){const x=70+R()*220;for(let i=0;i<4;i++)addQ(i*20,()=>mk('b',x,-20,{ph:i}))}
 else{const n=st>2?3:2;for(let i=0;i<n;i++)addQ(i*25,()=>mk('c',50+R()*260,-20,{stop:90+R()*120}))}}
function spawnBoss(){const hp=260+st*140;boss={id:++id,type:'boss',x:W/2,y:-70,hp,max:hp,r:42,sz:96,pts:10000*st,age:0,fl:0};en.push(boss);fx.push({txt:'⚠ 便器接近中 ⚠',x:W/2,y:H/2,life:120,big:1})}
function drop(e){let k=null;if(e.type==='d'||e.type==='boss')k='SHR'[Math.floor(R()*3)];else if(R()<.07)k=R()<.5?'SHR'[Math.floor(R()*3)]:(R()<.8?'B':'L');
 if(e.type==='boss'){it.push({x:e.x-30,y:e.y,k:'B',a:0});it.push({x:e.x+30,y:e.y,k:'L',a:0})}
 if(k)it.push({x:e.x,y:e.y,k,a:R()*6})}
function boom(x,y,n,c){for(let i=0;i<n;i++){const a=R()*6.28,s=1+R()*4;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+R()*25,c:c||(R()<.5?'#a8692f':'#ffffff'),r:2+R()*3})}}
function kill(e){e.dead=1;score+=e.pts;boom(e.x,e.y,e.type==='boss'?80:12);fx.push({txt:'+'+e.pts,x:e.x,y:e.y,life:40});drop(e);
 if(e.type==='boss'){boss=null;eb=[];shake=30;flash=20;clearT=200;fx.push({txt:`ステージ${st} クリア！`,x:W/2,y:H/2,life:160,big:1})}}
function hit(e,d){if(e.type==='boss'&&e.y<60)return;e.hp-=d;e.fl=4;if(e.hp<=0&&!e.dead)kill(e)}
function bomb(){if(mode!=='play'||paused||P.bombs<=0)return;P.bombs--;eb=[];flash=24;shake=12;P.inv=Math.max(P.inv,70);for(const e of en)if(e.y>-30)hit(e,e.type==='boss'?40:25);for(let i=0;i<12;i++)fx.push({emo:'💨',x:R()*W,y:R()*H,life:40,vy:-1});hud()}
function die(){boom(P.x,P.y,40);shake=20;P.lives--;P.lv=Math.max(1,P.lv-1);P.inv=150;eb=[];P.bombs=Math.max(P.bombs,2);hud();
 if(P.lives<0){mode='over';if(score>hi){hi=score;try{localStorage.setItem('unko-shmup-hi',hi)}catch(_){}}
  $('res').innerHTML=`スコア <b>${score.toLocaleString()}</b>　ステージ${st}<br>ハイスコア ${hi.toLocaleString()}`;setTimeout(()=>$('over').classList.add('show'),900)}}
function fire(){const {x,y,lv,w}=P;
 if(w==='S'){P.cd=8;const n=[1,3,5][lv-1];for(let i=0;i<n;i++){const a=-Math.PI/2+(i-(n-1)/2)*.17;pb.push({x,y:y-14,vx:Math.cos(a)*9,vy:Math.sin(a)*9,d:1,s:16})}}
 else if(w==='R'){P.cd=4;const n=lv+1;for(let i=0;i<n;i++)pb.push({x:x+(i-(n-1)/2)*11,y:y-14,vx:0,vy:-12,d:.55,s:12,pierce:new Set()})}
 else{P.cd=11;const n=lv+1;for(let i=0;i<n;i++){const a=-Math.PI/2+(i-(n-1)/2)*.6;pb.push({x,y:y-8,vx:Math.cos(a)*6,vy:Math.sin(a)*6,d:1.3,s:15,home:1})}}}
const keys={};
function step(){
 bgy=(bgy+1.6)%40;
 for(const f of fx){f.life--;if(f.vx!==undefined){f.x+=f.vx;f.y+=f.vy;f.vx*=.95;f.vy*=.95}else if(f.vy)f.y+=f.vy}
 fx=fx.filter(f=>f.life>0);if(flash)flash--;if(shake)shake--;
 if(mode!=='play')return;
 t++;
 if(clearT){if(--clearT===0){st++;const k=P;reset();P=k;P.inv=90;hud()}}
 else if(!boss){if(t<60*42){if(--spcd<=0){pattern();spcd=Math.max(38,105-st*10-t/50)}if(t%(60*12)===60*9)mk('d',60+R()*240,-30)}
  else if(!en.length&&!q.length)spawnBoss()}
 q=q.filter(o=>{if(t>=o.at){o.f();return false}return true});
 const k=3.6;if(keys.ArrowLeft||keys.a)P.x-=k;if(keys.ArrowRight||keys.d)P.x+=k;if(keys.ArrowUp||keys.w)P.y-=k;if(keys.ArrowDown||keys.s)P.y+=k;
 P.x=Math.max(14,Math.min(W-14,P.x));P.y=Math.max(30,Math.min(H-20,P.y));
 if(P.lives>=0){if(--P.cd<=0)fire();if(P.inv>0)P.inv--}
 for(const b of pb){if(b.home){let tg=null,bd=1e9;for(const e of en){if(e.y<0)continue;const d=dist(b,e);if(d<bd){bd=d;tg=e}}
   if(tg){const ca=Math.atan2(b.vy,b.vx),ta=Math.atan2(tg.y-b.y,tg.x-b.x);let df=ta-ca;df=Math.atan2(Math.sin(df),Math.cos(df));const na=ca+Math.max(-.14,Math.min(.14,df)),s=Math.min(9,Math.hypot(b.vx,b.vy)+.3);b.vx=Math.cos(na)*s;b.vy=Math.sin(na)*s}}
  b.x+=b.vx;b.y+=b.vy;
  for(const e of en){if(e.dead||b.dead)continue;if(dist(b,e)<e.r+6){if(b.pierce){if(b.pierce.has(e.id))continue;b.pierce.add(e.id)}else b.dead=1;hit(e,b.d)}}}
 pb=pb.filter(b=>!b.dead&&b.y>-20&&b.y<H+20&&b.x>-20&&b.x<W+20);
 const s=sp0();
 for(const e of en){e.age++;if(e.fl)e.fl--;
  switch(e.type){
  case'a':e.y+=1.9+st*.2;e.x+=Math.sin(e.age*.03)*.4;break;
  case'b':e.y+=1.5;e.x=e.x0+Math.sin(e.age*.05+e.ph)*60;if(st>1&&e.age%90===45)shot(e.x,e.y,ang(e.x,e.y),s);break;
  case'c':if(e.age<200&&e.y<e.stop)e.y+=2.2;else if(e.age<260)0;else e.y+=2.4;if(e.y>=e.stop&&e.age%50===0){const a=ang(e.x,e.y);shot(e.x,e.y,a,s);if(st>1){shot(e.x,e.y,a-.25,s);shot(e.x,e.y,a+.25,s)}}break;
  case'd':if(e.age<520){if(e.y<110)e.y+=1.2}else e.y+=1.5;if(e.y>=110&&e.age%70===0)ring(e.x,e.y,10+st*2,s*.8,e.age*.05);break;
  case'boss':{if(e.y<130){e.y+=1.2;break}e.x=W/2+Math.sin(e.age*.012)*105;const rage=e.hp<e.max/2,ph=Math.floor(e.age/240)%4,a=e.age;
   if(ph===0&&a%(rage?18:26)===0)ring(e.x,e.y+20,14+st*2,s*.85,a*.1);
   if(ph===1&&a%40===0){const n=rage?7:5,b=ang(e.x,e.y);for(let i=0;i<n;i++)shot(e.x,e.y+20,b+(i-(n-1)/2)*.16,s*1.25)}
   if(ph===2&&a%(rage?4:6)===0){shot(e.x,e.y+20,a*.15,s*.95);shot(e.x,e.y+20,a*.15+Math.PI,s*.95)}
   if(ph===3&&a%60===0){mk('a',e.x-40,e.y+30);mk('a',e.x+40,e.y+30);ring(e.x,e.y+20,10,s*.7)}}}
  if(P.inv<=0&&P.lives>=0&&!e.dead&&dist(e,P)<e.r*.75+6){if(e.type!=='boss')hit(e,99);die()}}
 en=en.filter(e=>!e.dead&&e.y<H+50&&e.x>-60&&e.x<W+60);
 for(const b of eb){b.x+=b.vx;b.y+=b.vy;if(P.inv<=0&&P.lives>=0&&Math.hypot(b.x-P.x,b.y-P.y)<b.r+3.5){b.dead=1;die();break}}
 eb=eb.filter(b=>!b.dead&&b.y>-20&&b.y<H+20&&b.x>-20&&b.x<W+20);
 for(const o of it){o.a+=.05;o.y+=1.1;o.x+=Math.sin(o.a)*.6;if(P.lives>=0&&dist(o,P)<26){o.dead=1;get(o.k)}}
 it=it.filter(o=>!o.dead&&o.y<H+20);
 if(++hudT%6===0)hud()}
function get(k){let m;if(k==='B'){P.bombs=Math.min(5,P.bombs+1);m='ボム＋1'}else if(k==='L'){P.lives=Math.min(6,P.lives+1);m='残機＋1'}
 else{if(P.w===k)P.lv=Math.min(3,P.lv+1);else P.w=k;m=`${WN[k]} Lv${P.lv}`}score+=500;fx.push({txt:m,x:P.x,y:P.y-30,life:50});hud()}
function hud(){if(!P)return;$('sc').textContent=score.toLocaleString();$('hi').textContent=Math.max(hi,score).toLocaleString();$('st').textContent=st;
 $('lv').textContent=P.lives>0?'💩'.repeat(P.lives):'なし';$('bn').textContent=P.bombs;$('wp').textContent=`${WE[P.w]} ${WN[P.w]} Lv${P.lv}`}
function draw(){
 ctx.save();if(shake)ctx.translate((R()-.5)*shake*.6,(R()-.5)*shake*.6);
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0e2d36');g.addColorStop(1,'#123c47');ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
 ctx.strokeStyle='#1f5260';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<=W;x+=40){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=bgy-40;y<=H;y+=40){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
 for(const o of it){ctx.fillStyle='#ffffff22';ctx.beginPath();ctx.arc(o.x,o.y,17+Math.sin(o.a*3)*2,0,7);ctx.fill();de({S:'🌶️',H:'🍠',R:'🥛',B:'💨',L:'💖'}[o.k],o.x,o.y,22)}
 for(const e of en){if(e.fl&&e.fl%2){ctx.globalAlpha=.55}de(e.type==='boss'?'🚽':'🧻',e.x,e.y,e.sz,e.type==='a'?e.age*.05:0);ctx.globalAlpha=1}
 for(const b of pb)de('💩',b.x,b.y,b.s,b.home?Math.atan2(b.vy,b.vx)+Math.PI/2:0);
 if(P&&P.lives>=0&&mode!=='title'&&!(P.inv>0&&Math.floor(P.inv/5)%2)){de('💩',P.x,P.y,34);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(P.x,P.y+3,3,0,7);ctx.fill()}
 for(const b of eb){ctx.fillStyle='#4fb3e8';ctx.beginPath();ctx.arc(b.x,b.y,b.r+2,0,7);ctx.fill();ctx.fillStyle='#e6f8ff';ctx.beginPath();ctx.arc(b.x,b.y,b.r-1.5,0,7);ctx.fill()}
 for(const f of fx){if(f.emo){ctx.globalAlpha=Math.min(1,f.life/20);de(f.emo,f.x,f.y,40);ctx.globalAlpha=1}
  else if(f.txt){ctx.globalAlpha=Math.min(1,f.life/20);ctx.font=f.big?'26px "Dela Gothic One",sans-serif':'800 14px "M PLUS Rounded 1c",sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#0b2229';ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.big?'#f2b53a':'#fff';ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1}
  else{ctx.globalAlpha=Math.min(1,f.life/20);ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill();ctx.globalAlpha=1}}
 if(boss&&boss.y>0){ctx.fillStyle='#0008';ctx.fillRect(20,12,W-40,10);ctx.fillStyle=boss.hp<boss.max/2?'#e8563f':'#f2b53a';ctx.fillRect(20,12,(W-40)*Math.max(0,boss.hp/boss.max),10);ctx.font='800 12px "M PLUS Rounded 1c"';ctx.fillStyle='#fff';ctx.textAlign='left';ctx.fillText('便器',22,36)}
 ctx.restore();
 if(flash){ctx.fillStyle=`rgba(255,240,210,${flash/40})`;ctx.fillRect(0,0,W,H)}}
let acc=0,lt=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(100,ts-lt||16);lt=ts;if(paused)return;acc+=dt;let n=0;while(acc>=16.67&&n<5){step();acc-=16.67;n++}if(n===5)acc=0;draw()}
requestAnimationFrame(loop);
let drag=null;
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('button')||mode!=='play')return;drag={px:e.clientX,py:e.clientY,x:P.x,y:P.y,id:e.pointerId};try{wrap.setPointerCapture(e.pointerId)}catch(_){}});
wrap.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const k=W/cv.clientWidth*1.25;P.x=Math.max(14,Math.min(W-14,drag.x+(e.clientX-drag.px)*k));P.y=Math.max(30,Math.min(H-20,drag.y+(e.clientY-drag.py)*k))});
const up=e=>{if(drag&&e.pointerId===drag.id)drag=null};wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
$('bomb').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();bomb()});
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key==='x'||e.key==='X'||e.key==='b')bomb();if(e.key==='p'||e.key==='Escape')setPause(!paused);if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key]=0});
function setPause(v){if(mode!=='play')return;paused=v;$('pause').classList.toggle('show',v)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true)});
$('start').onclick=newGame;$('retry').onclick=newGame;$('resume').onclick=()=>{setPause(false);lt=performance.now()};
hud();$('hi').textContent=hi.toLocaleString();
}
</script>
</body>
</html>
